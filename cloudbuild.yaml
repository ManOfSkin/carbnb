steps:
  # 1. Construction de l'image Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/carbnb', '.']

  # 2. Envoi de l'image sur le registre Google
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/carbnb']

  # 3. Déploiement Serverless sur Cloud Run (Région Europe)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'carbnb'
      - '--image'
      - 'gcr.io/$PROJECT_ID/carbnb'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--max-instances'
      - '2'
images:
  - 'gcr.io/$PROJECT_ID/carbnb'